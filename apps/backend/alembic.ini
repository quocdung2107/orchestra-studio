# CLI usage: `uv run alembic upgrade head` (URL comes from ORCHESTRA_* settings).
[alembic]
script_location = src/orchestra_backend/migrations

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s: %(message)s
